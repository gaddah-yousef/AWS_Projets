name: AWS lab static validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate syntax without accessing AWS
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.sh' -print0 | while IFS= read -r -d '' file; do
            echo "bash -n $file"
            bash -n "$file"
          done
      - name: Confirm no credentials are tracked
        run: |
          git ls-files | grep -Ei '(customer_.*\.xml$|\.pem$|\.key$|\.tfstate$)' && exit 1 || exit 0
